services:
    database:
        image: mysql
        container_name: laravelstore-database
        ports:
            - "3308:3306"
        restart: always
        command:
            - mysqld
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: laravelstore
            MYSQL_USER: faride
            MYSQL_PASSWORD: faride1234
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - laravelstore

    phpmyadmin:
        image: phpmyadmin
        container_name: laravelstore-phpmyadmin
        restart: always
        ports:
            - "8081:80"
        environment:
            PMA_HOST: database
            PMA_PORT: 3306
        networks:
            - laravelstore
    redis:
        image: redis:alpine
        container_name: laravelstore-redis
        restart: always
        ports:
            - "6380:6379"
        networks:
            - laravelstore


volumes:
    dbdata:

networks:
    laravelstore:
